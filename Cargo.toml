[package]
name = "firefly_music"
version = "0.15.0"
edition = "2024"
authors = ["lyns0"]
description = "A Terminal Music Player"
readme = "README.md"
repository = "https://github.com/ilialyl/firefly"
license = "MIT"
keywords = ["music"]
categories = ["command-line-utilities"]
exclude = ["example_img/", ".github/", ".*", "test_assets/"]



[dependencies]
rodio = "0.21.1"
ratatui = "0.29.0"
color-eyre = "0.6.5"
crossterm = "0.29.0"
rfd = "0.15.4"
lofty = "0.22.4"
rust_ffmpeg = "0.1"
tokio = { version = "1.48.0", features = ["full"] }
once_cell = "1.21.3"
log = "0.4.28"
fern = "0.7.1"
humantime = "2.3.0"
glob = "0.3.3"
platform-dirs = "0.3.0"
clap = "4.5.50"
strum = "0.27"
strum_macros = "0.27"
serde = "1.0"
serde_json = "1.0.145"
opus = "0.3.0"
ogg = "0.9.2"
rand = "0.9.2"
ratatui-image = "8.0.2"
image = "0.25.8"
mpris-server = "0.9.0"
axum = "0.8.6"
local-ip-address = "0.6.5"
tower-http = { version = "0.6.6", features = ["fs"] }
config = "0.15.19"
zbus = "5.13.2"
lazy_static = "1.5.0"
symphonia = "0.5.5"
symphonia-adapter-libopus = "0.2.6"
[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = ">=0.59, <=0.61"
features = [
    "Win32_UI_HiDpi"
]
